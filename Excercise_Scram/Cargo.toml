[package]
name = "scram-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
# Crypto primitives
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
hkdf="0.12.4"
base64 = "0.21"
sha3 = "0.10"
aes-gcm = "0.10"
aead = "0.5"
hex = "0.4"
hex-literal = "1.1.0"
rcgen = "0.14.5"

# Crypto
x25519-dalek = "2.0.1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }

# Serialization (for messages)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# CLI (optional, for main.rs)
clap = { version = "4.0", features = ["derive"] }

[[example]]
name = "setup_password_file"
path = "examples/setup_password_file.rs"

[dev-dependencies]
tempfile = "3.8"  # For testing password file I/O